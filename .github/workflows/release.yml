name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: samuelba/actions/release-please@563bf7ae6023a9191920575d554f912a7389a888 # v1.1.0
        id: release
        with:
          # A fine-grained PAT lets CI run on the release pull request. Without it, the release still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
