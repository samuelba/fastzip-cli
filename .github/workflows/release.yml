name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: samuelba/actions/release-please@563bf7ae6023a9191920575d554f912a7389a888 # v1.1.0
        id: release
        with:
          # A fine-grained PAT lets CI run on the release pull request. Without it, the release still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      BINARY: fastzip-cli-linux-${{ matrix.goarch }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "$BINARY" .
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum "$BINARY" > "$BINARY.sha256"
          gh release upload "$TAG" "$BINARY" "$BINARY.sha256" --clobber
